<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    .grid-container {
      display: grid;
      width: 748px;
      height: 748px; /*746px will result in no black border leaking below*/
      background-color: #000;
      gap: 9px;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 20px;
    }

    .item {
      background-color: #F0F1EC;
    }

    #item-1 {
      background-color: #E72F24;
      grid-column: 1 / 2;
      grid-row: 1 / 2;
    }

    #item-2 {
      grid-column: 2 / 5;
      grid-row: 1 / 2;
    }

    #item-3 {
      grid-column: 1 / 2;
      grid-row: 2 / 4;
    }

    #item-4 {
      grid-column: 2 / 4;
      grid-row: 2 / 4;
    }

    #item-5 {
      background-color: #004592;
      grid-column: 4 / 5;
      grid-row: 2 / 3;
      border-bottom: 9px solid #000;
    }

    #item-6 {
      grid-column: 1 / 2;
      grid-row: 4 / 5;
    }

    #item-7 {
      background-color: #F9D01E;
      grid-column: 2 / 3;
      grid-row: 4 / 5;
    }

    #item-8 {
      background-color: #232629;
      grid-column: 3 / 4;
      grid-row: 4 / 5;
    }

    #item-9 {
      grid-column: 4 / 5;
      grid-row: 3 / 5;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
  <div class="grid-container">
    <div class="item" id="item-1"></div>
    <div class="item" id="item-2"></div>
    <div class="item" id="item-3"></div>
    <div class="item" id="item-4"></div>
    <div class="item" id="item-5"></div>
    <div class="item" id="item-6"></div>
    <div class="item" id="item-7"></div>
    <div class="item" id="item-8"></div>
    <div class="item" id="item-9"></div>
  </div>
</body>

</html>
